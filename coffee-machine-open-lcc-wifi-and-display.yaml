esphome:
  project:
    name: open-lcc.bianca
    version: 0.0.1
  name: coffee-machine-open-lcc
  name_add_mac_suffix: true
  platformio_options:
    build_flags:
      - -O2
    build_unflags:
      - -Os
      - -Werror=all
    board_build.flash_mode: dio
    board_build.partitions: "/config/esphome/custom_partitions.csv"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_TLS_INSECURE: y
      CONFIG_ESP_TLS_SKIP_SERVER_CERT_VERIFY: y

psram:
  mode: octal
  speed: 80MHz

wifi:
  use_address: 192.168.22.191
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "coffee-machine-open-lcc"
    password: "Q6ZTCYOyJYoo"

ble_client:
# Acaia MAC Address (Replace with yours)
  - mac_address: 00:1C:97:1A:DC:D6
    id: acaia_client
# Uncomment for Pressensor
#  - mac_address: 66:77:88:99:AA:BB
#    id: pressensor_id

ota:
  - platform: esphome
    password: "3cb5da205da46d2319d2044d381ef9b0"

uart:
  baud_rate: 115200
  tx_pin: GPIO17
  rx_pin: GPIO18

esp32_ble_tracker:
  # on_ble_advertise:
  #   - then:
  #       - lambda: |-
  #           std::string name = x.get_name();
  #           if (name.find("LUNAR") != std::string::npos || name.find("ACAIA") != std::string::npos || name.find("PEARL") != std::string::npos) {
  #             ESP_LOGE("ACAIA_HUNTER", ">>> TARGET ACQUIRED! MAC IS: %s <<<", x.address_str().c_str());
  #           }

acaia:
  ble_client_id: acaia_client
  id: acaia_1

output:
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        output: true
    id: rp2040_en
  - platform: gpio
    pin:
      number: GPIO6
      mode:
        output: true
    id: rp2040_serial_boot
  - platform: gpio
    pin:
      number: GPIO5
      mode:
        output: true
        open_drain: true
    id: rp2040_bootsel

switch:
  - platform: output
    id: rp2040_serial_boot_sw
    name: "RP2040 Serial Boot"
    output: 'rp2040_serial_boot'
    restore_mode: ALWAYS_ON
    internal: true
  - platform: output
    id: rp2040_bootsel_sw
    name: "RP2040 Bootsel"
    output: 'rp2040_bootsel'
    restore_mode: ALWAYS_ON
    internal: true
  - platform: output
    id: rp2040_en_sw
    name: "RP2040 Enable"
    output: 'rp2040_en'
    restore_mode: ALWAYS_ON
    internal: true
  - platform: open_lcc_bianca
    eco_mode:
      id: eco_mode_sw
      name: Eco Mode
    sleep_mode:
      id: sleep_mode_sw
      name: Sleep Mode
    low_flow_mode:
      id: low_flow_sw
      name: Low Flow
    standby_mode:
      id: standby_mode_sw
      name: Standby Mode

open_lcc_bianca:
  id: lcc_1

logger:
  level: DEBUG
  baud_rate: 0

text_sensor:
  - platform: open_lcc_bianca
    status:
      id: status
      name: LCC Status

binary_sensor:
  - platform: template
    name: "Template Currently Brewing"
    internal: true
    id: templ_brewing
    on_press:
      - if:
          condition:
            binary_sensor.is_on: acaia_connected
          then:
            - acaia.tare: acaia_1
            - acaia.reset_timer: acaia_1
            - acaia.start_timer: acaia_1
      # - display.page.show: page_brewing_sensors
    on_release:
      - if:
          condition:
            binary_sensor.is_on: acaia_connected
          then:
            - acaia.stop_timer: acaia_1
      # - delay: 3s
      # - display.page.show: page_idle
  - platform: open_lcc_bianca
    brewing:
      name: Currently Brewing
      id: brewing
      internal: true
      on_state:
        - binary_sensor.template.publish:
            id: templ_brewing
            state: !lambda 'return x;'
    filling_service_boiler:
      name: Filling Service Boiler
      id: filling_service_boiler_sens
      internal: true
    water_tank_low:
      name: Water Tank Low
      id: water_low_sens
    brew_boiler_heating:
      name: Brew Boiler Heating
      id: brew_boiler_on
    service_boiler_heating:
      name: Service Boiler Heating
      id: service_boiler_on
  - platform: acaia
    connected:
      name: Acaia Connected
      id: acaia_connected
      internal: true
  - platform: gpio
    pin:
      number: GPIO38
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - number.increment: coffee_set_point
    internal: true
    name: "Plus button"
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - number.decrement: coffee_set_point
    internal: true
    name: "Minus button"

button:
  - platform: template
    name: "Reboot RP2040 to BOOTSEL"
    on_press:
      - open_lcc.bianca.hard_bail: lcc_1
      - delay: 3s
      - switch.turn_off: rp2040_en_sw
      - delay: 500ms
      - switch.turn_off: rp2040_bootsel_sw
      - delay: 1s
      - switch.turn_on: rp2040_en_sw
      - delay: 2s
      - switch.turn_on: rp2040_bootsel_sw
    entity_category: "diagnostic"
  - platform: template
    name: "Reboot RP2040 to Serial Boot"
    on_press:
      - open_lcc.bianca.hard_bail: lcc_1
      - delay: 3s
      - switch.turn_off: rp2040_en_sw
      - delay: 500ms
      - switch.turn_off: rp2040_serial_boot_sw
      - delay: 1s
      - switch.turn_on: rp2040_en_sw
      - delay: 2s
      - switch.turn_on: rp2040_serial_boot_sw
    entity_category: "diagnostic"
  - platform: template
    name: "Enqueue Routine"
    on_press:
      - open_lcc.bianca.enqueue_routine: lcc_1

number:
  - platform: open_lcc_bianca
    coffee_boiler_temperature_offset:
      id: bbto
      name: Coffee Boiler Temperature Offset
      mode: box
      entity_category: "config"
    auto_sleep_after:
      id: asa
      name: Auto Sleep After
      mode: box
      entity_category: "config"
    coffee_boiler_temperature_set_point:
      id: coffee_set_point
      name: Coffee boiler set point
      mode: box
    service_boiler_temperature_set_point:
      id: service_set_point
      name: Service boiler set point
      mode: box

sensor:
  - platform: open_lcc_bianca
    coffee_boiler_temperature:
      name: Coffee Boiler Temperature
      id: coffee_boiler_sens
    service_boiler_temperature:
      name: Service Boiler Temperature
      id: service_boiler_sens
    external_temperature_1:
      name: E61 Outlet Temperature
      id: outlet_temp_sens
    external_temperature_2:
      name: E61 Inlet Temperature
      id: inlet_temp_sens
    auto_sleep_in:
      name: Auto-sleep in
      unit_of_measurement: "min"
      accuracy_decimals: 0
      filters:
        - lambda: return x / 60;
        - or:
            - throttle: 60s
            - delta: 0.45
    current_routine:
      name: Currently Loaded Routine ID
    current_routine_step:
      name: Current Routine Step
    rp2040_uptime:
      id: rp2040_up
      name: RP2040 Uptime
      unit_of_measurement: "min"
      accuracy_decimals: 0
      entity_category: "diagnostic"
      filters:
        - lambda: return x / 60;
        - or:
            - throttle: 60s
            - delta: 0.45
    brew_time:
      name: Brew time
      id: brew_time
  - platform: acaia
    weight:
      id: scale_sens
      name: Scale weight
      accuracy_decimals: 1
      unit_of_measurement: g
      filters:
        - lambda: return x * 1000;
    flow:
      name: Scale flow
      id: flow_sens
  - platform: wifi_signal 
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: uptime
    id: esp32_up
    name: "ESP32 Uptime"
    unit_of_measurement: "min"
    accuracy_decimals: 0
    filters:
      - lambda: return x / 60;
      - or:
          - throttle: 60s
          - delta: 0.45
    entity_category: "diagnostic"

api:
  reboot_timeout: 0s
  encryption:
    key: "rGIhL6mKywQCW2HHH6hk2gjjq1y7Uy2bl6u8KQwvp7M="

captive_portal:

web_server:
  port: 80
  ota: false 
  log: false
  include_internal: true

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  interface: hardware

i2c:
  sda: 2
  scl: 1
  scan: true
  id: qwiic_3

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font12
    size: 24
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font36
    size: 48
  - file: "9x15.bdf"
    id: font2
  - file: "5x7.bdf"
    id: font1

image:
  - file: "xbm/pump_on_2x.h"
    id: pump_on
    type: BINARY
    transparency: chroma_key
  - file: "xbm/no_water_2x.h"
    id: no_water
    type: BINARY
    transparency: chroma_key
  - file: "xbm/eco_mode_2x.h"
    id: eco_mode
    type: BINARY
    transparency: chroma_key
  - file: "xbm/bssr_on_2x.h"
    id: bssr_on
    type: BINARY
    transparency: chroma_key
  - file: "xbm/sssr_on_2x.h"
    id: sssr_on
    type: BINARY
    transparency: chroma_key

color:
 - id: white
   red: 100%
   green: 100%
   blue: 100%
 - id: black
   red: 0%
   green: 0%
   blue: 0%

display:
 - platform: ssd1306_spi
   update_interval: 0.5s
   model: "SSD1306 128x64"
   cs_pin: GPIO10
   dc_pin: GPIO9
   reset_pin: GPIO8
   rotation: 180°
   lambda: |-
     it.printf(16, 16, id(font1), "%s", id(status).state.c_str());
     it.printf(16, 24, id(font1), "Brew: %.1f (%.1f)", id(coffee_boiler_sens).state, id(coffee_set_point).state);
     
     // --- UPDATED DISPLAY HIERARCHY FOR MODES ---
     if (id(standby_mode_sw).state) {
       it.print(16, 32, id(font1), "Standby mode");
     } else if (id(eco_mode_sw).state) {
       it.print(16, 32, id(font1), "Eco mode");
     } else {
       it.printf(16, 32, id(font1), "Serv: %.1f (%.1f)", id(service_boiler_sens).state, id(service_set_point).state);
     }
     
     if (id(brewing).state) {
       it.printf(16, 40, id(font1), "Brewing, %.0f s", id(brew_time).state);
     }
     
     // Pressensor disabled, Acaia weight active
     it.printf(16, 56, id(font1), "Wei: %.1f g", id(scale_sens).state);

     it.printf(90, 16, id(font1), "%.0f", id(wifi_signal_db).state);

     // Corrected sensor IDs
     if (id(filling_service_boiler_sens).state) {
       it.image(90, 26, id(pump_on), id(black), id(white));
     }
     if (id(water_low_sens).state) {
       it.image(90, 36, id(no_water), id(black), id(white));
     }

     if (id(brew_boiler_on).state) {
       it.print(90, 46, id(font1), "B");
     } else if (id(service_boiler_on).state) {
       it.print(90, 46, id(font1), "S");
     }