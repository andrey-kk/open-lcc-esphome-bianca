# Copy these entries into the secrets.yaml that sits next to your ESPHome
# configs (in Home Assistant: /config/esphome/secrets.yaml) and fill in real
# values. Never commit the real secrets.yaml - it is listed in .gitignore.

wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"

# Password for the fallback hotspot the machine opens when Wi-Fi is down
coffee_machine_ap_password: "change-me-min-8-chars"

# Password for over-the-air firmware updates
coffee_machine_ota_password: "change-me"

# Home Assistant API encryption key: 32 random bytes, base64-encoded.
# Generate one with:  openssl rand -base64 32
coffee_machine_api_key: "REPLACE_WITH_BASE64_KEY="
